# Settings for scripts/refresh-session.sh (read as shell; keep it to simple assignments).

# the display output (see `kscreen-doctor -o`)
OUTPUT=eDP-1

# the refresh rate to switch to: exactly 6 x 23.976 fps (143.856 Hz), 6 refreshes per video frame
TARGET_HZ=143.856

# how far from TARGET_HZ a listed mode may be and still count as the match. KDE can only store a mode
# near the request (143.87 Hz here, 0.012 % fast: about one frame of drift in 5.5 minutes, which mpv
# corrects). The earlier 143.77 Hz mode (0.06 % off) was measured at 90 % of frames on time.
TOLERANCE_HZ=0.05

# `setup` only: what to ask KDE for when no matching mode exists. KDE stored 143950 mHz (reduced
# blanking) as 143.874 Hz; it stores the request about 0.077 Hz low, and its steps are coarse
# (143933 gave the same 143.874 Hz), so 143.874 is the closest to TARGET_HZ available.
CUSTOM_MHZ=143950
CUSTOM_BLANKING=reduced     # reduced | full

# seconds to wait after switching the mode, so the program that asked starts presenting afterwards
SETTLE_SECONDS=2

# desktop notifications when the mode is switched or restored (1 = on, 0 = off)
NOTIFY=1

# `watch` mode only: how often to look for dead requesters, in seconds
POLL_SECONDS=2
