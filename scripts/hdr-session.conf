# Settings for scripts/hdr-session.sh (read as shell; keep it to simple assignments).

# the display output (see `kscreen-doctor -o`)
OUTPUT=eDP-1

# what HDR mode should look like while something HDR is running. Real HDR content is BT.2020, so
# wide colour gamut is needed to carry it, and the factory ICC profile gives KDE the panel's real
# primaries and black level. (For SDR content in HDR mode other values won the comparisons; this is
# for HDR content.)
HDR_WCG=enable        # enable | disable
HDR_SOURCE=ICC        # ICC | EDID

# seconds to wait after switching HDR on, so the program that asked can start presenting afterwards
SETTLE_SECONDS=2

# desktop notifications when HDR is switched on or off (1 = on, 0 = off)
NOTIFY=1

# `watch` mode only: how often to look, in seconds
POLL_SECONDS=2

# `watch` mode only: processes that count as asking for HDR. Each entry is a regular expression
# matched against the full command line (pgrep -f). Anchored on purpose, so a command that merely
# mentions the words (an editor, a shell) is not mistaken for the program itself.
# gamescope only outputs HDR when started with --hdr-enabled (and when KDE is in HDR mode at that
# moment), so only that form is listed.
WATCH_PATTERNS=(
    '^([^ ]*/)?gamescope( |$).*--hdr-enabled'
)
