# Key and wheel overrides for the mpv touch setup.
# Anything not listed here keeps mpv's default binding.

# Arrow keys seek by mpv's default amounts, then flash uosc's timeline so the seek is visible
# (mpv's own seek bar is off because of osd-bar=no, and uosc only shows it when asked).
# They are "relative+exact" like the touch gestures: mpv's default for a relative seek is
# keyframe-only, which reports the target time and then jumps again to the keyframe it
# really landed on, so the bar moved twice. An exact seek reports one position.
RIGHT       seek  5 relative+exact ; script-binding uosc/flash-timeline
LEFT        seek -5 relative+exact ; script-binding uosc/flash-timeline
UP          seek  60 relative+exact ; script-binding uosc/flash-timeline
DOWN        seek -60 relative+exact ; script-binding uosc/flash-timeline
Shift+RIGHT no-osd seek  1 exact ; script-binding uosc/flash-timeline
Shift+LEFT  no-osd seek -1 exact ; script-binding uosc/flash-timeline
Shift+UP    no-osd seek  5 exact ; script-binding uosc/flash-timeline
Shift+DOWN  no-osd seek -5 exact ; script-binding uosc/flash-timeline

# uosc's pause_indicator is "manual" (see script-opts/uosc.conf) so that the short hold
# after a seek (scripts/seek-pause.lua) does not blink a pause icon. Pauses made by you
# flash the icon explicitly, as in mpv's defaults otherwise.
SPACE       cycle pause ; script-binding uosc/flash-pause-indicator
p           cycle pause ; script-binding uosc/flash-pause-indicator
MBTN_RIGHT  cycle pause ; script-binding uosc/flash-pause-indicator
PLAY        cycle pause ; script-binding uosc/flash-pause-indicator
PAUSE       cycle pause ; script-binding uosc/flash-pause-indicator
PLAYPAUSE   cycle pause ; script-binding uosc/flash-pause-indicator
PLAYONLY    set pause no ; script-binding uosc/flash-pause-indicator
PAUSEONLY   set pause yes ; script-binding uosc/flash-pause-indicator

# Two-finger horizontal touchpad scroll sends many wheel events per swipe, and mpv's
# default seeks 10 s on every one, so a short swipe jumped minutes. Turn them off.
# Vertical scroll (WHEEL_UP / WHEEL_DOWN, volume) is unchanged.
WHEEL_LEFT  ignore
WHEEL_RIGHT ignore

# Ctrl+q is the quit key (mpv has no default binding for it). The position is saved
# because mpv.conf has save-position-on-quit=yes.
ctrl+q      quit
# Plain q is unbound so it cannot quit by accident (mpv's default is quit).
# Shift+Q (quit-watch-later) and Ctrl+w (quit) are left as mpv has them.
q           ignore

# Both of these start OFF, because they cost battery. They are switches for when you want them.

# Ctrl+u: anime upscaling, cycling light -> balanced -> quality -> off (starts off). The message
# on screen names the tier. Which shaders each tier uses is listed in scripts/upscale-tier.lua.
ctrl+u      script-message upscale-tier-cycle

# Ctrl+p: smooths fast camera moves only, to hide their stepping; character animation is left alone.
# Inside a camera move it blurs the real frames and adds an in-between frame, from weak to full frame
# doubling. Cycles mix-high -> mix-max -> step -> step-adaptive -> mix-step -> double ->
# mix-step-double -> off (starts off).
# Needs a VapourSynth-enabled mpv such as cachyos/mpv-git plus vapoursynth-plugin-mvtools;
# with the stock mpv it says so on screen and changes nothing. See scripts/pan-blur.lua.
ctrl+p      script-message pan-blur-cycle
