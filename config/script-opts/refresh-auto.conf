# Options for scripts/refresh-auto.lua (see the header of that script for what it does).

# no turns the whole thing off
enabled=yes

# the arbiter that keeps track of who wants the matched refresh rate and restores your mode afterwards
session_command=/home/termis/Projects/mpv-touch/scripts/refresh-session.sh

# the frame rate that triggers the switch, and how far from it still counts. 24.000 fps is outside
# the default tolerance on purpose (the matched mode is 6 x 23.976 Hz, not 6 x 24).
target_fps=23.976
tolerance=0.02

# only ask when mpv has a real window; headless runs (--vo=null) never switch the display
require_vo=yes

# seconds with no matching video before the mode is let go (covers the gap between playlist items)
release_delay=4

# pause playback while the display switches (about two seconds) and resume afterwards;
# a player that starts paused is left alone
pause_while_switching=yes
