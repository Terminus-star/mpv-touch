# yes/no: turn the whole script on or off
enabled=yes
# Refresh rates at or above this (Hz) are treated as the VRR mode and left alone.
# The Z13 panel runs 48-180 Hz (VRR) in its 180 Hz mode and 60 Hz otherwise.
vrr_min_hz=100
# How close refresh / fps must be to a whole number to count as an even fit (0.005 = 0.5 %)
tolerance=0.005
