# Options for scripts/hdr-auto.lua (see the header of that script for what it does).

# no turns the whole thing off
enabled=yes

# the arbiter that keeps track of who wants HDR and restores the display afterwards
session_command=/home/termis/Projects/mpv-touch/scripts/hdr-session.sh

# only ask for HDR when mpv has a real window; headless runs (--vo=null) never switch the display
require_vo=yes

# seconds with no HDR video before HDR is let go (covers the gap between playlist items)
release_delay=4
