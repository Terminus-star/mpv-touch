# Modified from the upstream mpv-touch-gestures config by Seifelden Abdelmonem (2026): horizontal_drag is
# seek, and the brightness options are added. GPL-2.0, like the original (LICENSES/GPL-2.0-only.txt).
#
# valid options are:
# 'playlist' for changing the playlist item by swiping
# 'seek' for seeking by dragging
horizontal_drag=seek

# scale seeking based on the duration of the video
proportional_seek=yes

# scale factor for seeking
seek_scale=1

# lowest screen brightness the left-side vertical swipe can reach, in percent
# (so a single swipe cannot black out the screen)
brightness_min=5

# where the left-side swipe gets the brightness from:
#   auto    KDE's brightness service if it is running, otherwise the backlight through systemd-logind
#   kde     KDE's brightness service only (the same value as KDE's slider; the right one in HDR mode)
#   logind  the backlight in /sys/class/backlight through systemd-logind (any systemd desktop)
#   mpv     mpv's own picture brightness: works anywhere, but only changes the video
brightness_backend=auto