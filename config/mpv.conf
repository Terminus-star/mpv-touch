# mpv config for the touch comparison.
# Used only through --config-dir (see ../scripts/run.sh), never read from ~/.config/mpv.

# uosc draws its own controls, seek/volume indicators and window border
osc=no
osd-bar=no
border=no

# window dragging would fight the drag gestures
window-dragging=no

# Decode video on the GPU (VA-API) instead of the CPU: about 6.5-8.4x less CPU work in tests
# on this machine. "auto-safe" only uses decoders mpv trusts and falls back to the CPU by
# itself for what the GPU cannot decode (for example 10-bit H.264, common in older anime).
hwdec=auto-safe

# Open fullscreen, and wait for you to press play instead of starting by itself
fullscreen=yes
pause=yes

# Started with no files, mpv waits instead of quitting at once, so last-session.lua can
# reopen your last playlist. Started with a file it behaves as before (quits when done).
idle=once

# Resume videos that were quit half-way: the position is saved on quit and restored next time.
# Not saved when a file plays to the end or you move to the next playlist item, so finished
# videos start from the beginning.
save-position-on-quit=yes
# fullscreen-align.lua shifts video-align-y while in fullscreen. mpv would save that value
# too (it is on the default list) and restore it in windowed mode, so keep it off the list.
watch-later-options-remove=video-align-y

# To try the "video at the top, black bars at the bottom" idea, uncomment:
# video-align-y=-1
